<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面跳转中…</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #666; }
  </style>
</head>
<body>
  <p>页面跳转中…</p>
  <script>
    // S5 深链兜底: 纯静态托管 (GitHub Pages / Netlify / nginx 无 try_files) 下
    // 直访 /cards 等深链返回 404 时, 记录目标路径并回首页, 由 App 启动时恢复导航。
    try {
      var p = location.pathname + location.search;
      if (p && p !== '/' && p !== '/index.html') {
        localStorage.setItem('wyw_deep_link', p);
      }
    } catch (e) { /* ignore */ }
    location.replace('/');
  </script>
</body>
</html>
